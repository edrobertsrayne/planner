name: Test Suite

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  # A weekend run against main with no code change (issue #187) — the e2e suite computes its
  # dates from whichever real day it runs on, so a break in that arithmetic (like #186's
  # Saturday slot-supply shortfall) needs a Saturday or Sunday run to catch, not just Mon-Fri CI.
  schedule:
    - cron: '17 6 * * 6,0'
  workflow_dispatch:

# Test env defaults live in vite.config.ts so local and CI runs behave identically.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      - name: Run tests
        run: bun run test
