name: CI

# One workflow so `needs` can order the jobs: lint, then test. A failure skips everything after it.

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A new push supersedes the run for the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Run linters
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: actions/setup-node@v6
        with:
          # Keep in step with `engines.node` in package.json, which pins the deployment's Node.
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run linters
        run: npm run lint

      - name: Type check
        run: npm run check

  test:
    name: Test Suite
    needs: lint
    runs-on: ubuntu-latest
    # Fifteen minutes was enough while the layout suite was one file. A cold cache — which every
    # package-lock.json change forces — spends most of that on `npm ci` and the Chromium download, and
    # the suite itself now resets a database and signs in once per screen file.
    # Test env defaults live in vite.config.ts so local and CI runs behave identically.
    timeout-minutes: 30

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: actions/setup-node@v6
        with:
          # Keep in step with `engines.node` in package.json, which pins the deployment's Node.
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm run test

      # playwright.config.ts keeps a trace of every failed test in test-results/. Without this
      # upload the only record of a failure is the console log.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
