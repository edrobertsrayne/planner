name: CI

# One workflow so `needs` can order the jobs: lint, then test, then the review agent. A failure
# skips everything after it, so a broken PR never spends inference on the review.

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A new push supersedes the run for the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Run linters
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: actions/setup-node@v6
        with:
          # Keep in step with `engines.node` in package.json, which pins the deployment's Node.
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run linters
        run: npm run lint

      - name: Type check
        run: npm run check

  test:
    name: Test Suite
    needs: lint
    runs-on: ubuntu-latest
    # Fifteen minutes was enough while the layout suite was one file. A cold cache — which every
    # package-lock.json change forces — spends most of that on `npm ci` and the Chromium download, and
    # the suite itself now resets a database and signs in once per screen file.
    # Test env defaults live in vite.config.ts so local and CI runs behave identically.
    timeout-minutes: 30

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: actions/setup-node@v6
        with:
          # Keep in step with `engines.node` in package.json, which pins the deployment's Node.
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm run test

      # playwright.config.ts keeps a trace of every failed test in test-results/. Without this
      # upload the only record of a failure is the console log.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  review:
    name: Review
    needs: test
    # Forks get no secrets and a read-only token, so the review could not run or comment.
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Posting a comment or reaction on a PR needs pull-requests: write; issues: write alone is a 403.
      pull-requests: write
      issues: write
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Review the pull request
        # Tracks the `latest` tag, so a new release reaches this step unreviewed. It runs with
        # OPENCODE_API_KEY and a write token.
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/deepseek-v4.1-flash
          variant: max
          prompt: |
            Review this pull request. Review only the diff (`gh pr diff`), not the rest of the codebase. Open other files only when a change can't be judged without them.

            Report only issues that would prevent merging, each with file, line and the concrete failure. Do not report nitpicks or optional suggestions. If there are none, say so in one line.
          use_github_token: true
